trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: rg-aks-learning
  location: westeurope

  # Must be globally unique
  acrName: abhishekaksacr2026

  aksName: aks-learning-cluster

  imageName: aks-demo
  imageTag: v1

stages:

# =========================================================
# STAGE 1 - CREATE AZURE INFRASTRUCTURE
# =========================================================

- stage: CreateInfrastructure
  displayName: Create Azure Infrastructure

  jobs:

  - job: CreateInfra
    displayName: Create Resource Group, ACR and AKS

    steps:

    - task: AzureCLI@2
      displayName: Verify Azure Subscription

      inputs:
        azureSubscription: Abhishek
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          az account show

    - task: AzureCLI@2
      displayName: Create AKS Infrastructure

      inputs:
        azureSubscription: Abhishek
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          echo "Creating Resource Group"

          az group create \
            --name $(resourceGroup) \
            --location $(location)

          echo "Creating Azure Container Registry"

          az acr create \
            --resource-group $(resourceGroup) \
            --name $(acrName) \
            --sku Basic

          echo "Creating AKS Cluster"

            az aks create \
              --resource-group $(resourceGroup) \
              --name $(aksName) \
              --node-count 1 \
              --enable-cluster-autoscaler \
              --min-count 1 \
              --max-count 2 \
              --generate-ssh-keys \
              --node-vm-size Standard_D2as_v5

# =========================================================
# STAGE 2 - APPROVAL BEFORE BUILD
# =========================================================

- stage: ApprovalBeforeBuild
  displayName: Approval Before Docker Build

  dependsOn: CreateInfrastructure

  jobs:

  - job: WaitForApproval
    displayName: Manual Approval Before Build
    pool: server

    steps:

    - task: ManualValidation@0
      timeoutInMinutes: 1440

      inputs:
        notifyUsers: ''
        instructions: |
          Please validate:
          - Resource Group created successfully
          - ACR created successfully
          - AKS cluster created successfully

          Approve to continue Docker image build and push.

        onTimeout: reject

# =========================================================
# STAGE 3 - BUILD AND PUSH DOCKER IMAGE
# =========================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Image

  dependsOn: ApprovalBeforeBuild

  jobs:

  - job: DockerBuild
    displayName: Build Docker Image

    steps:

    - task: Docker@2
      displayName: Build Docker Image

      inputs:
        command: build
        Dockerfile: app/Dockerfile
        buildContext: app
        repository: $(imageName)

        tags: |
          $(imageTag)

    - task: AzureCLI@2
      displayName: Login to Azure Container Registry

      inputs:
        azureSubscription: Abhishek
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          az acr login --name $(acrName)

    - script: |

        echo "Tagging Docker Image"

        docker tag $(imageName):$(imageTag) \
        $(acrName).azurecr.io/$(imageName):$(imageTag)

        echo "Pushing Docker Image"

        docker push \
        $(acrName).azurecr.io/$(imageName):$(imageTag)

      displayName: Push Docker Image to ACR

# =========================================================
# STAGE 4 - APPROVAL BEFORE DEPLOYMENT
# =========================================================

- stage: ApprovalBeforeDeployment
  displayName: Approval Before AKS Deployment

  dependsOn: BuildAndPush

  jobs:

  - job: WaitForDeploymentApproval
    displayName: Manual Approval Before Deployment
    pool: server

    steps:

    - task: ManualValidation@0
      timeoutInMinutes: 1440

      inputs:
        notifyUsers: ''
        instructions: |
          Please validate:
          - Docker image built successfully
          - Docker image pushed to ACR
          - ACR repository contains latest image

          Approve to continue AKS deployment.

        onTimeout: reject

# =========================================================
# STAGE 5 - DEPLOY APPLICATION TO AKS
# =========================================================

- stage: DeployToAKS
  displayName: Deploy Application to AKS

  dependsOn: ApprovalBeforeDeployment

  jobs:

  - job: Deploy
    displayName: Deploy Kubernetes Resources

    steps:

    - task: AzureCLI@2
      displayName: Connect and Deploy to AKS

      inputs:
        azureSubscription: Abhishek
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          echo "Getting AKS Credentials"

          az aks get-credentials \
            --resource-group $(resourceGroup) \
            --name $(aksName) \
            --overwrite-existing

          echo "Preparing Deployment Manifest"

          IMAGE=$(acrName).azurecr.io/$(imageName):$(imageTag)

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml

          echo "Deploying Application"

          kubectl apply -f k8s/deployment.yaml

          echo "Deploying Service"

          kubectl apply -f k8s/service.yaml

          echo "Checking Nodes"

          kubectl get nodes

          echo "Checking Pods"

          kubectl get pods -o wide

          echo "Checking Services"

          kubectl get svc

# =========================================================
# STAGE 6 - FINAL APPROVAL / VALIDATION
# =========================================================

- stage: FinalValidation
  displayName: Final Validation Approval

  dependsOn: DeployToAKS

  jobs:

  - job: FinalApproval
    displayName: Validate Deployment
    pool: server

    steps:

    - task: ManualValidation@0
      timeoutInMinutes: 1440

      inputs:
        notifyUsers: ''
        instructions: |
          Please validate:
          - Pods are running successfully
          - Service external IP is accessible
          - Application is reachable
          - AKS deployment completed successfully

          Approve to complete pipeline.

        onTimeout: reject