apiVersion: apps/v1
kind: Deployment

metadata:
  name: aks-demo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aks-demo

  template:
    metadata:
      labels:
        app: aks-demo

    spec:
      containers:
      - name: aks-demo

        image: IMAGE_PLACEHOLDER

        ports:
        - containerPort: 8000